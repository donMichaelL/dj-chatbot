[tox]
requires =
    tox>=4.2
env_list =
    py314-django{60, 52}
    py313-django{60, 52, 51}
    py312-django{60, 52, 51, 50, 42}

[testenv]
deps =
    coverage[toml]
    pytest>=8
    pytest-asyncio>=0.24
    pytest-cov>=6
    pytest-django>=4.8
    pytest-randomly
    django42: django~=4.2.0
    django50: django~=5.0.0
    django51: django~=5.1.0
    django52: django~=5.2.0
    django60: django~=6.0.0
set_env =
    COVERAGE_FILE = {toxworkdir}/../.coverage/coverage.{envname}
    PYTHONDEVMODE = 1
commands =
    python -W error::ResourceWarning -W error::DeprecationWarning -W error::PendingDeprecationWarning -m pytest {posargs}
